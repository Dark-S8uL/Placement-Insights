<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Placement and Insights</title>
    <style>
      :root {
        --bg: #f4efe6;
        --panel: rgba(255, 255, 255, 0.78);
        --text: #1f2328;
        --muted: #667085;
        --accent: #0f766e;
        --accent-soft: rgba(15, 118, 110, 0.12);
        --accent-2: #ca8a04;
        --border: rgba(31, 35, 40, 0.1);
        --shadow: 0 22px 60px rgba(21, 29, 38, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        color: var(--text);
        font-family: "Trebuchet MS", "Lucida Grande", sans-serif;
        background:
          radial-gradient(
            circle at top left,
            rgba(15, 118, 110, 0.15),
            transparent 30%
          ),
          radial-gradient(
            circle at top right,
            rgba(202, 138, 4, 0.18),
            transparent 28%
          ),
          linear-gradient(135deg, #f7f2e8 0%, #f0e7d7 55%, #f7f4ef 100%);
        min-height: 100vh;
      }

      a {
        color: inherit;
      }

      .wrap {
        width: min(1240px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        backdrop-filter: blur(16px);
        box-shadow: var(--shadow);
        border-radius: 24px;
      }

      .hero {
        display: grid;
        grid-template-columns: 1.35fr 0.95fr;
        gap: 18px;
        align-items: stretch;
        margin-bottom: 18px;
      }

      .hero-main {
        padding: 30px;
        position: relative;
        overflow: hidden;
      }

      .hero-main::after {
        content: "";
        position: absolute;
        inset: auto -60px -60px auto;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(15, 118, 110, 0.24),
          transparent 68%
        );
        pointer-events: none;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
      }

      h1 {
        margin: 18px 0 12px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.3rem, 4vw, 4.8rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }

      .hero-copy {
        max-width: 68ch;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
      }

      .hero-actions {
        margin-top: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .hero-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        border-radius: 14px;
        padding: 13px 18px;
        font-weight: 700;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .hero-link:hover {
        transform: translateY(-1px);
      }

      .primary-link {
        background: linear-gradient(135deg, var(--accent), #115e59);
        color: white;
        box-shadow: 0 16px 32px rgba(15, 118, 110, 0.22);
      }

      .ghost-link {
        background: rgba(255, 255, 255, 0.78);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .hero-side {
        padding: 24px;
        display: grid;
        gap: 14px;
        align-content: start;
      }

      .side-note {
        color: var(--muted);
        line-height: 1.6;
      }

      .workflow {
        display: grid;
        gap: 12px;
      }

      .workflow-step {
        padding: 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid var(--border);
      }

      .workflow-step strong {
        display: block;
        margin-bottom: 5px;
      }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 18px;
      }

      .stat {
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
        min-height: 100px;
      }

      .stat .label {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 10px;
      }

      .stat .value {
        font-size: 1.8rem;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .section {
        padding: 24px;
        margin-top: 18px;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .section-title h2 {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: -0.03em;
      }

      .section-title span {
        color: var(--muted);
        font-size: 0.92rem;
      }

      .cards-3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .info-card {
        padding: 18px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid var(--border);
      }

      .info-card h3 {
        margin: 0 0 8px;
        font-size: 1rem;
      }

      .info-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        padding: 9px 12px;
        border-radius: 999px;
        background: rgba(15, 118, 110, 0.1);
        color: #125e5b;
        border: 1px solid rgba(15, 118, 110, 0.12);
        font-size: 13px;
        font-weight: 700;
      }

      .layout {
        display: grid;
        grid-template-columns: 1.02fr 0.98fr;
        gap: 18px;
        align-items: start;
        margin-top: 18px;
      }

      .card {
        padding: 24px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 0.95rem;
        color: #2f3640;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid rgba(31, 35, 40, 0.12);
        background: rgba(255, 255, 255, 0.9);
        border-radius: 14px;
        padding: 12px 14px;
        font: inherit;
        outline: none;
        transition:
          border-color 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
        transform: translateY(-1px);
      }

      .actions {
        margin-top: 16px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 14px;
        padding: 13px 18px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          opacity 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: linear-gradient(135deg, var(--accent), #115e59);
        color: white;
        box-shadow: 0 16px 32px rgba(15, 118, 110, 0.22);
      }

      .secondary {
        background: rgba(255, 255, 255, 0.8);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .result-box {
        margin-top: 18px;
        border-radius: 20px;
        padding: 18px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.8);
      }

      .result-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border-radius: 999px;
        padding: 8px 12px;
        font-weight: 700;
        margin-bottom: 12px;
      }

      .placed {
        background: rgba(15, 118, 110, 0.12);
        color: var(--accent);
      }

      .not-placed {
        background: rgba(202, 138, 4, 0.14);
        color: #92400e;
      }

      .mini-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 16px;
      }

      .mini {
        padding: 14px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid var(--border);
      }

      .mini .mini-label {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 6px;
      }

      .mini .mini-value {
        font-size: 1.25rem;
        font-weight: 800;
      }

      .bars {
        display: grid;
        gap: 12px;
        margin-top: 12px;
      }

      .pie-wrap {
        display: grid;
        grid-template-columns: 180px minmax(0, 1fr);
        gap: 16px;
        align-items: center;
        margin-top: 12px;
      }

      .pie-chart {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        border: 1px solid var(--border);
      }

      .pie-legend {
        display: grid;
        gap: 10px;
      }

      .legend-row {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: space-between;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.8);
        border-radius: 12px;
        padding: 10px 12px;
      }

      .legend-left {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .method-list {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .method-item {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.84);
        padding: 12px 14px;
      }

      .method-item strong {
        display: block;
        margin-bottom: 6px;
      }

      .bar-row {
        display: grid;
        gap: 6px;
      }

      .bar-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 0.92rem;
        color: #374151;
      }

      .bar-track {
        height: 12px;
        border-radius: 999px;
        background: rgba(31, 35, 40, 0.08);
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), #36b6a8);
      }

      .muted {
        color: var(--muted);
      }

      .list-block {
        margin: 12px 0 0;
        padding-left: 18px;
        color: #374151;
        line-height: 1.6;
      }

      .footer {
        margin-top: 18px;
        padding: 22px 24px;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        flex-wrap: wrap;
        align-items: center;
      }

      .footer small {
        color: var(--muted);
      }

      .auth-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(
          135deg,
          rgba(59, 130, 246, 0.08) 0%,
          rgba(14, 165, 233, 0.12) 100%
        );
      }

      .auth-card {
        width: min(1100px, 100%);
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        overflow: hidden;
      }

      .auth-hero {
        padding: 34px;
        color: white;
        background: linear-gradient(
          145deg,
          #0f172a 0%,
          #0f766e 55%,
          #111827 100%
        );
      }

      .auth-hero h1,
      .auth-hero p {
        color: white;
      }

      .auth-form-panel {
        padding: 34px;
        background: rgba(255, 255, 255, 0.92);
      }

      .auth-form {
        display: grid;
        gap: 12px;
        margin-top: 18px;
      }

      .auth-field {
        display: grid;
        gap: 8px;
      }

      .auth-field small {
        color: var(--muted);
      }

      .auth-tips {
        margin-top: 18px;
        padding-left: 18px;
        line-height: 1.7;
        color: #374151;
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 290px minmax(0, 1fr);
      }

      .sidebar {
        position: sticky;
        top: 0;
        align-self: start;
        min-height: 100vh;
        padding: 24px;
        background: rgba(15, 23, 42, 0.96);
        color: white;
        border-right: 1px solid rgba(255, 255, 255, 0.08);
      }

      .brand-block {
        padding-bottom: 18px;
        margin-bottom: 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .brand-title {
        font-size: 1.15rem;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .brand-subtitle {
        margin-top: 8px;
        color: rgba(255, 255, 255, 0.72);
        line-height: 1.6;
      }

      .role-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
      }

      .role-admin {
        background: rgba(15, 118, 110, 0.2);
        color: #a7f3d0;
      }

      .role-student {
        background: rgba(202, 138, 4, 0.2);
        color: #fde68a;
      }

      .sidebar-nav {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .sidebar-link,
      .sidebar-button {
        width: 100%;
        border: 0;
        text-align: left;
        border-radius: 16px;
        padding: 13px 15px;
        background: transparent;
        color: rgba(255, 255, 255, 0.9);
        cursor: pointer;
        font: inherit;
      }

      .sidebar-link.active,
      .sidebar-button.active {
        background: rgba(255, 255, 255, 0.1);
      }

      .sidebar-link:hover,
      .sidebar-button:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .sidebar-meta {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: grid;
        gap: 10px;
      }

      .sidebar-meta small {
        color: rgba(255, 255, 255, 0.7);
      }

      .main-panel {
        padding: 24px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .topbar h1 {
        margin: 0;
        font-size: clamp(1.5rem, 2vw, 2.3rem);
      }

      .topbar-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .overview-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .overview-card,
      .download-card,
      .student-card,
      .profile-card {
        padding: 18px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid var(--border);
      }

      .overview-label {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 10px;
      }

      .overview-value {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .section-stack {
        display: grid;
        gap: 18px;
        margin-top: 18px;
      }

      .dashboard-grid,
      .analytics-grid,
      .students-grid,
      .downloads-grid {
        display: grid;
        gap: 18px;
      }

      .dashboard-grid {
        grid-template-columns: 1.2fr 0.8fr;
      }

      .analytics-grid,
      .students-grid,
      .downloads-grid {
        grid-template-columns: 1fr 1fr;
      }

      .section-card {
        padding: 22px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid var(--border);
      }

      .section-card h2 {
        margin: 0 0 10px;
      }

      .section-card p {
        color: var(--muted);
        line-height: 1.65;
      }

      .download-actions,
      .student-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      .flat-button {
        border-radius: 14px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.9);
        color: var(--text);
      }

      .danger-button {
        background: rgba(202, 138, 4, 0.12);
        color: #92400e;
      }

      .table-wrap {
        overflow: auto;
        border-radius: 18px;
        border: 1px solid var(--border);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(255, 255, 255, 0.85);
      }

      th,
      td {
        padding: 12px 14px;
        border-bottom: 1px solid rgba(31, 35, 40, 0.08);
        text-align: left;
      }

      th {
        background: rgba(15, 118, 110, 0.05);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .student-list {
        display: grid;
        gap: 12px;
      }

      .student-card {
        display: grid;
        gap: 10px;
      }

      .student-card strong {
        font-size: 1rem;
      }

      .job-grid {
        display: grid;
        gap: 12px;
      }

      .job-card {
        display: grid;
        gap: 10px;
        padding: 16px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid var(--border);
      }

      .job-card strong {
        font-size: 1rem;
      }

      .job-card a {
        text-decoration: none;
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(15, 118, 110, 0.1);
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
      }

      .section-empty {
        padding: 18px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.78);
        border: 1px dashed var(--border);
        color: var(--muted);
      }

      .download-selector {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .status-line {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(15, 118, 110, 0.08);
        color: #115e59;
      }

      @media (max-width: 1080px) {
        .auth-card,
        .app-shell,
        .dashboard-grid,
        .analytics-grid,
        .students-grid,
        .downloads-grid,
        .overview-grid,
        .cards-3 {
          grid-template-columns: 1fr;
        }

        .sidebar {
          min-height: auto;
          position: relative;
        }
      }

      @media (max-width: 640px) {
        .wrap {
          width: min(100% - 20px, 1240px);
        }

        .hero-main,
        .hero-side,
        .card,
        .section,
        .footer,
        .main-panel,
        .sidebar,
        .auth-form-panel,
        .auth-hero {
          padding: 18px;
        }

        .stat-grid,
        .form-grid,
        .mini-grid,
        .overview-grid {
          grid-template-columns: 1fr;
        }

        .pie-wrap {
          grid-template-columns: 1fr;
          justify-items: center;
        }

        .pie-chart {
          width: 150px;
          height: 150px;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>

  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;
      const STORAGE_KEY = "placement-insights-session";

      function parseRoute() {
        const raw = window.location.hash.replace(/^#/, "") || "login";
        const [page, param] = raw.split("/");
        return { page: page || "login", param: param || "" };
      }

      async function requestJSON(url, token, options = {}) {
        const headers = new Headers(options.headers || {});
        if (token) {
          headers.set("Authorization", `Bearer ${token}`);
        }
        const response = await fetch(url, { ...options, headers });
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          throw new Error(
            payload.detail || `Request failed with ${response.status}`,
          );
        }
        return response.json();
      }

      async function requestBlob(url, token) {
        const headers = new Headers();
        if (token) {
          headers.set("Authorization", `Bearer ${token}`);
        }
        const response = await fetch(url, { headers });
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          throw new Error(
            payload.detail || `Download failed with ${response.status}`,
          );
        }
        return response.blob();
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = filename;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(url);
      }

      function formatValue(value, fallback = "-") {
        if (value === null || value === undefined || value === "") {
          return fallback;
        }
        if (typeof value === "number") {
          return Number.isInteger(value) ? value.toString() : value.toFixed(2);
        }
        return value;
      }

      const BRANCHES = ["CS", "IT", "ECE", "EEE", "ME", "CE", "Other"];
      const COLLEGE_TIERS = ["Tier 1", "Tier 2", "Tier 3"];

      function profileDraft(profile) {

        const [success, setSuccess] = React.useState("");

          setError("");
          setSuccess("");
          if (!file) {
            setError("Choose a CSV file first.");
            return;

          setLoading(true);
          try {
            const formData = new FormData();
            formData.append("file", file);
            const payload = await requestJSON(
              "/api/admin/students/bulk-upload",
              token,
              {
                method: "POST",
                body: formData,
              },
            );
            setSuccess(payload.message || "Students uploaded successfully.");
            setFile(null);
            event.target.reset();
            if (onSuccess) await onSuccess();
          } catch (err) {
            setError(err.message);

            setLoading(false);

            ...items.map((item) => Math.abs(item[valueKey] ?? item.delta ?? 0)),
            1,
          );

          return (
            <div className="bars">
              {items.map((item) => {

                  item.placement_rate !== undefined

                      />
                    </div>

                    <div className="section-stack">
                      <div className="section-title">
                        <h2>Technical Skills</h2>
                        <span>Categorized like your sample</span>
                      </div>
                      <div className="form-grid">
                        <ResumeInput
                          label="Programming"
                          value={resumeForm.skills_programming}
                          onChange={(value) =>
                            setField("skills_programming", value)
                          }
                          placeholder="C++, JavaScript"
                          onKeyDownHandler={_stopKeyPropagation}
                        />
                        <ResumeInput
                          label="Frontend"
                          value={resumeForm.skills_frontend}
                          onChange={(value) =>
                            setField("skills_frontend", value)
                          }
                          placeholder="React.js, HTML, CSS"
                          onKeyDownHandler={_stopKeyPropagation}
                        />
                        <ResumeInput
                          label="Backend"
                          value={resumeForm.skills_backend}
                          onChange={(value) =>
                            setField("skills_backend", value)
                          }
                          placeholder="Node.js, Express.js"
                          onKeyDownHandler={_stopKeyPropagation}
                        />
                        <ResumeInput
                          label="Databases"
                          value={resumeForm.skills_databases}
                          onChange={(value) =>
                            setField("skills_databases", value)
                          }
                          placeholder="MongoDB, MySQL"
                          onKeyDownHandler={_stopKeyPropagation}
                        />
                        <ResumeInput
                          label="Tools"
                          value={resumeForm.skills_tools}
                          onChange={(value) => setField("skills_tools", value)}
                          placeholder="Git, GitHub, Postman"
                          onKeyDownHandler={_stopKeyPropagation}
                        />
                      </div>
                    </div>

                    <div className="section-stack">
                      <div className="section-title">
                        <h2>Experience</h2>
                        <span>One focused role block</span>
                      </div>
                      <div className="form-grid">
                        <ResumeInput
                          label="Role / Company title"
                          value={resumeForm.experience_1_title}
                          onChange={(value) =>
                            setField("experience_1_title", value)
                          }
                          placeholder="DotPe Pvt. Ltd. (Product-Based Company)"
                          onKeyDownHandler={_stopKeyPropagation}
                        />
                        <ResumeInput
                          label="Timeline and location"
                          value={resumeForm.experience_1_meta}
                          onChange={(value) =>
                            setField("experience_1_meta", value)
                          }
                          placeholder="Jul 2025 – Sept 2025 | Gurugram, Haryana"
                          onKeyDownHandler={_stopKeyPropagation}
                        />
                      </div>
                      <ResumeInput
                        label="Experience bullets"
                        value={resumeForm.experience_1_points}
                        onChange={(value) =>
                          setField("experience_1_points", value)
                        }
                        placeholder="Worked as a Full Stack Developer using React.js, Node.js, and Golang..."
                        multiline
                        rows={5}
                        onKeyDownHandler={_stopKeyPropagation}
                      />
                    </div>

                    <div className="section-stack">
                      <div className="section-title">
                        <h2>Projects</h2>
                        <span>Two project blocks with links</span>
                      </div>
                      <ResumeInput
                        label="Project 1 title"
                        value={resumeForm.project_1_title}
                        onChange={(value) => setField("project_1_title", value)}
                        placeholder="AI Finance Web Platform"
                        onKeyDownHandler={_stopKeyPropagation}
                      />
                      <ResumeInput
                        label="Project 1 link"
                        value={resumeForm.project_1_link}
                        onChange={(value) => setField("project_1_link", value)}
                        placeholder="Live / GitHub link"
                        onKeyDownHandler={_stopKeyPropagation}
                      />
                      <ResumeInput
                        label="Project 1 bullets"
                        value={resumeForm.project_1_points}
                        onChange={(value) =>
                          setField("project_1_points", value)
                        }
                        placeholder="Built a finance management platform..."
                        multiline
                        rows={4}
                        onKeyDownHandler={_stopKeyPropagation}
                      />
                      <ResumeInput
                        label="Project 2 title"
                        value={resumeForm.project_2_title}
                        onChange={(value) => setField("project_2_title", value)}
                        placeholder="Algorithm Visualizer"
                        onKeyDownHandler={_stopKeyPropagation}
                      />
                      <ResumeInput
                        label="Project 2 link"
                        value={resumeForm.project_2_link}
                        onChange={(value) => setField("project_2_link", value)}
                        placeholder="Live / GitHub link"
                        onKeyDownHandler={_stopKeyPropagation}
                      />
                      <ResumeInput
                        label="Project 2 bullets"
                        value={resumeForm.project_2_points}
                        onChange={(value) =>
                          setField("project_2_points", value)
                        }
                        placeholder="Developed a web-based tool to visualize sorting..."
                        multiline
                        rows={4}
                        onKeyDownHandler={_stopKeyPropagation}
                      />
                    </div>

                    <div className="section-stack">
                      <div className="section-title">
                        <h2>Additional Sections</h2>
                        <span>Optional finishing touches</span>
                      </div>
                      <ResumeInput
                        label="Certifications"
                        value={resumeForm.certifications}
                        onChange={(value) => setField("certifications", value)}
                        placeholder="Course name, issuer, year"
                        multiline
                        rows={3}
                        onKeyDownHandler={_stopKeyPropagation}
                      />
                      <ResumeInput
                        label="Achievements"
                        value={resumeForm.achievements}
                        onChange={(value) => setField("achievements", value)}
                        placeholder="Awards, rankings, leadership highlights"
                        multiline
                        rows={3}
                        onKeyDownHandler={_stopKeyPropagation}
                      />
                    </div>

                    <div className="download-actions">
                      <button
                        className="primary"
                        type="button"
                        onClick={saveResume}
                        disabled={savingResume}
                      >
                        {savingResume ? "Saving..." : "Save resume"}
                      </button>
                      <button
                        className="flat-button"
                        type="button"
                        onClick={downloadResumePdf}
                        disabled={busyDownload === "my_resume.pdf"}
                      >
                        {busyDownload === "my_resume.pdf"
                          ? "Downloading..."
                          : "Download PDF"}
                      </button>
                    </div>
                  </div>
                )}
              </section>
            </div>
          );
        };

        const Downloads = () => {
          const adminStudentId =
            selectedStudentId || students[0]?.student_id || "";
          const reportDepartments = analyticsOptions.departments?.length
            ? analyticsOptions.departments
            : rankingDepartments;
          const reportEndpoint = (slug, scope, department) => {
            const params = new URLSearchParams({ scope });
            if (scope === "department" && department) {
              params.set("department", department);
            }
            return `/api/download/${slug}.csv?${params.toString()}`;
          };
          return (
            <div className="downloads-grid">
              <section className="section-card">
                <div className="section-title">
                  <h2>Download section</h2>
                  <span>CSV exports</span>
                </div>
                <div className="download-actions">
                  {isAdmin ? (
                    <button
                      className="primary"
                      type="button"
                      onClick={() =>
                        downloadCsv(
                          "/api/download/overall.csv",
                          "overall_statistics.csv",
                        )
                      }
                      disabled={busyDownload === "overall_statistics.csv"}
                    >
                      {busyDownload === "overall_statistics.csv"
                        ? "Downloading..."
                        : "Overall statistics CSV"}
                    </button>
                  ) : null}
                  <button
                    className="flat-button"
                    type="button"
                    onClick={() =>
                      downloadCsv(
                        `/api/download/student.csv${isAdmin && adminStudentId ? `?student_id=${adminStudentId}` : ""}`,
                        `student_${adminStudentId || user.student_id}.csv`,
                      )
                    }
                    disabled={!isAdmin && !user}
                  >
                    {isStudent ? "My profile CSV" : "Student CSV"}
                  </button>
                  {isAdmin ? (
                    <>
                      <button
                        className="flat-button"
                        type="button"
                        onClick={() =>
                          downloadCsv(
                            "/api/download/dataset.csv",
                            "placement_dataset.csv",
                          )
                        }
                        disabled={busyDownload === "placement_dataset.csv"}
                      >
                        Raw dataset CSV
                      </button>
                      <button
                        className="flat-button"
                        type="button"
                        onClick={() =>
                          downloadCsv(
                            "/api/download/predictions.csv",
                            "dataset_predictions.csv",
                          )
                        }
                        disabled={busyDownload === "dataset_predictions.csv"}
                      >
                        Predictions CSV
                      </button>
                    </>
                  ) : null}
                </div>
                {isAdmin ? (
                  <div className="download-selector">
                    <label className="auth-field">
                      Student to export
                      <select
                        value={adminStudentId}
                        onChange={(event) =>
                          setSelectedStudentId(Number(event.target.value))
                        }
                      >
                        {students.map((student) => (
                          <option
                            key={student.student_id}
                            value={student.student_id}
                          >
                            {student.display_name || student.username} (ID{" "}
                            {student.student_id})
                          </option>
                        ))}
                      </select>
                    </label>
                  </div>
                ) : (
                  <div className="section-empty" style={{ marginTop: 14 }}>
                    Students can export only their own profile CSV.
                  </div>
                )}
              </section>

              {isAdmin ? (
                <section className="section-card">
                  <div className="section-title">
                    <h2>Improvement report</h2>
                    <span>Improvement areas by scope</span>
                  </div>
                  <div className="download-selector">
                    <label className="auth-field">
                      Scope
                      <select
                        value={improvementScope}
                        onChange={(event) => {
                          const nextScope = event.target.value;
                          setImprovementScope(nextScope);
                          if (nextScope === "overall") {
                            setImprovementDepartment("");
                          }
                        }}
                      >
                        <option value="overall">Overall</option>
                        <option value="department">Department wise</option>
                      </select>
                    </label>
                    {improvementScope === "department" ? (
                      <label className="auth-field">
                        Department
                        <select
                          value={improvementDepartment}
                          onChange={(event) =>
                            setImprovementDepartment(event.target.value)
                          }
                        >
                          <option value="">Select department</option>
                          {reportDepartments.map((department) => (
                            <option key={department} value={department}>
                              {department}
                            </option>
                          ))}
                        </select>
                      </label>
                    ) : null}
                    <button
                      className="primary"
                      type="button"
                      onClick={() =>
                        downloadCsv(
                          reportEndpoint(
                            "improvement-report",
                            improvementScope,
                            improvementDepartment,
                          ),
                          improvementScope === "department"
                            ? `improvement_report_department_${improvementDepartment || "selected"}.csv`
                            : "improvement_report_overall.csv",
                        )
                      }
                      disabled={
                        improvementScope === "department" &&
                        !improvementDepartment
                      }
                    >
                      Download Improvement CSV
                    </button>
                  </div>
                </section>
              ) : null}

              {isAdmin ? (
                <section className="section-card">
                  <div className="section-title">
                    <h2>Academic report</h2>
                    <span>Academic statistics by scope</span>
                  </div>
                  <div className="download-selector">
                    <label className="auth-field">
                      Scope
                      <select
                        value={academicScope}
                        onChange={(event) => {
                          const nextScope = event.target.value;
                          setAcademicScope(nextScope);
                          if (nextScope === "overall") {
                            setAcademicDepartment("");
                          }
                        }}
                      >
                        <option value="overall">Overall</option>
                        <option value="department">Department wise</option>
                      </select>
                    </label>
                    {academicScope === "department" ? (
                      <label className="auth-field">
                        Department
                        <select
                          value={academicDepartment}
                          onChange={(event) =>
                            setAcademicDepartment(event.target.value)
                          }
                        >
                          <option value="">Select department</option>
                          {reportDepartments.map((department) => (
                            <option key={department} value={department}>
                              {department}
                            </option>
                          ))}
                        </select>
                      </label>
                    ) : null}
                    <button
                      className="primary"
                      type="button"
                      onClick={() =>
                        downloadCsv(
                          reportEndpoint(
                            "academic-report",
                            academicScope,
                            academicDepartment,
                          ),
                          academicScope === "department"
                            ? `academic_report_department_${academicDepartment || "selected"}.csv`
                            : "academic_report_overall.csv",
                        )
                      }
                      disabled={
                        academicScope === "department" && !academicDepartment
                      }
                    >
                      Download Academic CSV
                    </button>
                  </div>
                </section>
              ) : null}

              <section className="section-card">
                <div className="section-title">
                  <h2>Export summary</h2>
                  <span>{roleLabel}</span>
                </div>
                <div className="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Item</th>
                        <th>Access</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td>Overall statistics CSV</td>
                        <td>{isAdmin ? "Allowed" : "Admin only"}</td>
                      </tr>
                      <tr>
                        <td>Per-student CSV</td>
                        <td>{user ? "Allowed" : "Login required"}</td>
                      </tr>
                      <tr>
                        <td>Raw dataset CSV</td>
                        <td>{isAdmin ? "Allowed" : "Admin only"}</td>
                      </tr>
                      <tr>
                        <td>Predictions CSV</td>
                        <td>{isAdmin ? "Allowed" : "Admin only"}</td>
                      </tr>
                      <tr>
                        <td>Improvement report CSV</td>
                        <td>{isAdmin ? "Allowed" : "Admin only"}</td>
                      </tr>
                      <tr>
                        <td>Academic report CSV</td>
                        <td>{isAdmin ? "Allowed" : "Admin only"}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </section>
            </div>
          );
        };

        const navHeader = (
          <div className="brand-block">
            <div className="brand-title">Smart Placement</div>
            <div className="brand-subtitle">
              Role-based portal for the placement research project.
            </div>
            <div
              className={`role-badge ${isAdmin ? "role-admin" : "role-student"}`}
            >
              {roleLabel} · {accessLabel}
            </div>
          </div>
        );

        return (
          <div className="app-shell">
            <aside className="sidebar">
              {navHeader}
              <nav className="sidebar-nav">
                {navItems.map((item) => (
                  <button
                    key={item.page}
                    className={`sidebar-button ${route.page === item.page ? "active" : ""}`}
                    type="button"
                    onClick={() => go(item.page)}
                  >
                    {item.label}
                  </button>
                ))}
              </nav>
              <div className="sidebar-meta">
                <small>{user.display_name || user.username}</small>
                <small>{user.username}</small>
                <small>{model.algorithm || "XGBClassifier"}</small>
                <button
                  className="sidebar-button"
                  type="button"
                  onClick={logout}
                >
                  Logout
                </button>
              </div>
            </aside>

            <main className="main-panel">
              <div className="topbar">
                <div>
                  <div className="eyebrow">{page.toUpperCase()}</div>
                  <h1>{isAdmin ? "Admin console" : "Student portal"}</h1>
                  <p className="muted">
                    {isAdmin
                      ? "Monitor placement trends, review student profiles, and export dataset reports."
                      : "Review your personal placement profile and download your CSV record."}
                  </p>
                </div>
                <div className="topbar-actions">
                  <button
                    className="flat-button"
                    type="button"
                    onClick={() => go("dashboard")}
                  >
                    Dashboard
                  </button>
                  {isAdmin ? (
                    <button
                      className="flat-button"
                      type="button"
                      onClick={() => go("analytics")}
                    >
                      Analytics
                    </button>
                  ) : (
                    <button
                      className="flat-button"
                      type="button"
                      onClick={() => go("resume")}
                    >
                      Resume
                    </button>
                  )}
                  <button
                    className="flat-button"
                    type="button"
                    onClick={logout}
                  >
                    Logout
                  </button>
                </div>
              </div>

              {loadingSession ? (
                <div className="section-empty">Loading your session...</div>
              ) : null}
              {pageError ? (
                <div className="status-line" style={{ marginBottom: 18 }}>
                  {pageError}
                </div>
              ) : null}
              {pageNotice ? (
                <div className="status-line" style={{ marginBottom: 18 }}>
                  {pageNotice}
                </div>
              ) : null}

              {page === "dashboard" ? <Dashboard /> : null}
              {page === "analytics" && isAdmin ? <Analytics /> : null}
              {page === "students" && isAdmin ? <Students /> : null}
              {page === "profile" ? <Profile /> : null}
              {page === "resume" ? <Resume /> : null}
              {page === "downloads" ? <Downloads /> : null}
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
